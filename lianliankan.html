<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f8ee">
<title>果然有趣 · 水果连连看</title>
<style>
  *{box-sizing:border-box} :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#304736;background:#f5f8ee;color-scheme:light}
  body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 5% 0%,#e5f2d6,transparent 55%),radial-gradient(ellipse at 100% 80%,#ffeddb,transparent 50%),#f8faf2;padding:36px 16px}
  main{max-width:700px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;margin:0 8px 24px}.eyebrow{font-size:10px;letter-spacing:3px;color:#77916d;margin:0 0 7px}h1{font-size:clamp(28px,5vw,38px);letter-spacing:2px;margin:0}.subtitle{margin:8px 0 0;font-size:13px;color:#7b8973}.badge{font-size:32px;background:#e8f0d7;border-radius:22px;padding:14px;transform:rotate(8deg)}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}.stat{background:#ffffffbc;border:1px solid #e2e9d7;border-radius:17px;padding:14px 18px}.stat span{font-size:12px;color:#7a8974}.stat strong{font-size:27px;display:block;margin-top:5px;font-variant-numeric:tabular-nums}.stat.danger strong{color:#d36645}
  .board-shell{position:relative;border:1px solid #dbe5cd;border-radius:25px;background:#ecf2e2;box-shadow:0 15px 40px #506e3210;padding:8px;overflow:hidden}
  .stage{position:relative;aspect-ratio:1;width:100%;isolation:isolate;background-image:radial-gradient(#cfdcbd 1px,transparent 1px);background-size:10% 10%;border-radius:18px}
  .grid{position:absolute;inset:10%;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));gap:clamp(3px,.9vw,7px)}
  button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}button:focus-visible{outline:3px solid #537e44;outline-offset:3px}button:disabled{cursor:default}
  .tile{border:1px solid #e0e8d2;border-bottom:4px solid #d8e3c8;border-radius:clamp(6px,1.6vw,12px);background:#fffef8;display:grid;place-items:center;padding:0;font-size:clamp(19px,4.4vw,35px);line-height:1;transition:transform .15s,background .15s,opacity .2s;min-width:0;min-height:0;user-select:none}
  .tile:hover:not(:disabled){background:#fff8db;transform:translateY(-2px)}.tile.selected{background:#f5fbcf;border-color:#7da95c;box-shadow:0 0 0 2px #9dbb71;transform:translateY(-2px)}.tile.hint{background:#fff0bb;border-color:#e9b54e;animation:pulse .6s ease-in-out 2}.tile.invalid{background:#ffe2d9;border-color:#e19983;animation:shake .25s}.tile.match{transform:scale(.7);opacity:0}.tile.empty{visibility:hidden;pointer-events:none}
  .lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;overflow:visible}.lines polyline{fill:none;stroke:#5ca968;stroke-width:.7;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 1px #fff)}
  .overlay{position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;text-align:center;flex-direction:column;padding:20px;background:#f5f8eef2;border-radius:18px;backdrop-filter:blur(5px)}[hidden]{display:none!important}.overlay .fruit{font-size:52px;margin-bottom:15px}.overlay h2{font-size:clamp(23px,5vw,32px);margin:0 0 12px}.overlay p{font-size:14px;color:#7a8974;line-height:1.9;margin:0 0 24px;white-space:pre-line}
  .primary{border:0;border-radius:13px;background:#51783f;color:white;padding:14px 30px;font-weight:650;box-shadow:0 6px 15px #527b4025}.primary:hover{background:#426732}.tools{display:flex;gap:9px;margin-top:17px;flex-wrap:wrap}.tool{border:1px solid #dce4d0;background:#ffffffc9;color:#4d6544;padding:12px 15px;border-radius:12px;flex:1;white-space:nowrap;font-size:13px}.tool:hover:not(:disabled){background:#e8f0db}.tool:disabled{opacity:.45}.tool b{margin-left:5px;font-size:11px;background:#eaf0dd;border-radius:5px;padding:2px 5px}
  .status{min-height:23px;text-align:center;margin:16px 0 10px;color:#63814e;font-size:13px}.instructions{text-align:center;color:#8a9680;font-size:12px;line-height:1.9;margin:8px 0}.record{text-align:center;margin:20px 0 0;font-size:12px;color:#859178}.record strong{color:#566f48}footer{text-align:center;font-size:10px;letter-spacing:3px;color:#a1ad95;margin-top:24px}
  @keyframes pulse{50%{box-shadow:0 0 0 3px #e9bb58}}@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
  @media(max-width:430px){body{padding:22px 10px}.stat{padding:12px}.stat strong{font-size:24px}.badge{font-size:26px;padding:11px}.board-shell{padding:4px;border-radius:18px}.tools{gap:6px}.tool{padding:11px 8px;font-size:12px}.subtitle{font-size:12px}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <header><div><p class="eyebrow">A LITTLE FRUITY BREAK</p><h1>果然有趣</h1><p class="subtitle">水果连连看 · 把快乐连在一起</p></div><div class="badge" aria-hidden="true">🍊</div></header>
  <section class="stats" aria-label="游戏状态"><div class="stat"><span>本局得分</span><strong id="score">0</strong></div><div class="stat" id="time-card"><span>剩余时间</span><strong id="time">03:00</strong></div><div class="stat"><span>剩余对数</span><strong id="pairs">32</strong></div></section>
  <div class="board-shell"><div class="stage">
    <div class="grid" id="grid" role="group" aria-label="水果棋盘，8 行 8 列"></div>
    <svg class="lines" viewBox="0 0 100 100" aria-hidden="true"><polyline id="line" points=""/></svg>
    <div class="overlay" id="overlay"><div class="fruit" id="overlay-fruit" aria-hidden="true">🍋</div><h2 id="overlay-title">来一局，补充快乐</h2><p id="overlay-text">找到相同水果，用不超过两次转弯的连线消除。
180 秒，把整片果园清空！</p><button class="primary" id="start">开始游戏</button></div>
  </div></div>
  <div class="tools"><button class="tool" id="pause" disabled>暂停</button><button class="tool" id="hint" disabled>提示 <b id="hint-count">3</b></button><button class="tool" id="shuffle" disabled>洗牌 <b id="shuffle-count">3</b></button><button class="tool" id="restart">重新开始</button></div>
  <p class="status" id="status" role="status" aria-live="polite">准备好了吗？今天的水果很新鲜。</p>
  <p class="instructions">相同水果 · 最多两次转弯 · 连线可绕过棋盘外沿<br>每消除一对 +10 分，无解时自动免费洗牌</p>
  <p class="record">最快通关 <strong id="best">暂无纪录</strong></p><footer>FRESH FRUIT. FRESH START.</footer>
</main>
<script>
'use strict';
const N=8, LIMIT=180000;
const FRUITS=['🍎','🍊','🍋','🍐','🍇','🍓','🍒','🥝','🍉','🍑','🥭','🍍','🫐','🍌','🥥','🍈'];
const $=id=>document.getElementById(id);
let board=[], state='ready', selected=null, score=0, hints=3, shuffles=3, remaining=LIMIT, startedAt=0, ticker=null, effectTimer=null, effect=null, hintCells=[], best=null;
const tiles=[];
try { const saved=Number(localStorage.getItem('fruity-link-best-ms')); if(saved>0 && saved<=LIMIT)best=saved; } catch {}
function formatTime(ms){const seconds=Math.ceil(Math.max(0,ms)/1000);return `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`;}
function showBest(){$('best').textContent=best===null?'暂无纪录':`${(best/1000).toFixed(1)} 秒`;}
function index(r,c){return r*N+c;}
function coords(i){return {r:Math.floor(i/N)+1,c:i%N+1};}
// Search the padded board, keeping the direction and number of turns in each state.
function findPath(a,b,values=board,ignoreFruit=false){
  if(a===b||!values[a]||!values[b]||(!ignoreFruit&&values[a]!==values[b]))return null;
  const start=coords(a), end=coords(b), dirs=[[-1,0],[0,1],[1,0],[0,-1]];
  const queue=[{...start,d:-1,t:0,parent:null}], visited=new Map();
  for(let qi=0;qi<queue.length;qi++){
    const node=queue[qi];
    for(let d=0;d<4;d++){
      const r=node.r+dirs[d][0],c=node.c+dirs[d][1],t=node.t+(node.d!==-1&&node.d!==d?1:0);
      if(r<0||r>N+1||c<0||c>N+1||t>2)continue;
      if(r===start.r&&c===start.c)continue;
      const destination=r===end.r&&c===end.c;
      if(!destination&&r>=1&&r<=N&&c>=1&&c<=N&&values[index(r-1,c-1)])continue;
      const key=`${r},${c},${d}`;
      if(visited.has(key)&&visited.get(key)<=t)continue;
      visited.set(key,t);
      const next={r,c,d,t,parent:node};
      if(destination){const path=[];for(let p=next;p;p=p.parent)path.push({r:p.r,c:p.c});return path.reverse();}
      queue.push(next);
    }
  }
  return null;
}
function findMove(values=board){for(let a=0;a<values.length;a++)if(values[a])for(let b=a+1;b<values.length;b++)if(values[a]===values[b]){const path=findPath(a,b,values);if(path)return {a,b,path};}return null;}
function mix(values){for(let i=values.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[values[i],values[j]]=[values[j],values[i]];}return values;}
function reshuffle(){
  const occupied=board.map((v,i)=>v?i:-1).filter(i=>i>=0);if(occupied.length===0)return;
  const values=occupied.map(i=>board[i]);
  for(let attempt=0;attempt<40;attempt++){mix(values);occupied.forEach((i,j)=>board[i]=values[j]);if(findMove())return;}
  // Bounded fallback: place an existing pair into two geometrically connectable cells.
  for(let x=0;x<occupied.length;x++)for(let y=x+1;y<occupied.length;y++){
    const a=occupied[x],b=occupied[y];if(!findPath(a,b,board,true))continue;
    const partner=occupied.find(i=>i!==a&&board[i]===board[a]);
    [board[b],board[partner]]=[board[partner],board[b]];return;
  }
  throw new Error('没有可连接的位置');
}
function ensureMove(){if(board.some(Boolean)&&!findMove()){reshuffle();$('status').textContent='刚才没有可连的水果，已为你免费洗牌。';}}
function draw(){
  tiles.forEach((tile,i)=>{const value=board[i];tile.textContent=value||'';tile.className='tile'+(!value?' empty':'')+(selected===i?' selected':'')+(hintCells.includes(i)?' hint':'');tile.disabled=!value||state!=='running'||!!effect;tile.setAttribute('aria-label',`第 ${Math.floor(i/N)+1} 行，第 ${i%N+1} 列${value?' '+value:'，空位'}`);tile.setAttribute('aria-pressed',String(selected===i));});
  $('score').textContent=score;$('pairs').textContent=board.filter(Boolean).length/2;$('hint-count').textContent=hints;$('shuffle-count').textContent=shuffles;
  $('pause').disabled=!['running','paused'].includes(state);$('pause').textContent=state==='paused'?'继续':'暂停';
  $('hint').disabled=state!=='running'||!!effect||hints===0;$('shuffle').disabled=state!=='running'||!!effect||shuffles===0;
  $('time').textContent=formatTime(remaining);$('time-card').classList.toggle('danger',remaining<=30000);
}
function clearEffect(){clearTimeout(effectTimer);effectTimer=null;effect=null;$('line').setAttribute('points','');}
function timeNow(){return state==='running'?Math.max(0,remaining-(performance.now()-startedAt)):remaining;}
function settleTime(){if(state==='running'){remaining=timeNow();startedAt=performance.now();if(remaining<=0){end(false);return false;}}return true;}
function showOverlay(title,text,button,fruit){$('overlay-title').textContent=title;$('overlay-text').textContent=text;$('start').textContent=button;$('overlay-fruit').textContent=fruit;$('overlay').hidden=false;}
function begin(){
  clearInterval(ticker);clearEffect();board=mix(Array.from({length:32},(_,i)=>FRUITS[i%FRUITS.length]).flatMap(v=>[v,v]));
  selected=null;hintCells=[];score=0;hints=3;shuffles=3;remaining=LIMIT;state='running';ensureMove();startedAt=performance.now();
  $('overlay').hidden=true;$('status').textContent='选两个相同水果，试着把它们连起来。';draw();
  ticker=setInterval(()=>{if(state==='running'){const left=timeNow();$('time').textContent=formatTime(left);$('time-card').classList.toggle('danger',left<=30000);if(left<=0){remaining=0;end(false);}}},100);
}
function end(won){
  const elapsed=LIMIT-timeNow();clearInterval(ticker);clearEffect();state=won?'won':'lost';selected=null;hintCells=[];
  if(won&&(best===null||elapsed<best)){best=elapsed;try{localStorage.setItem('fruity-link-best-ms',String(best));}catch{}showBest();}
  showOverlay(won?'整片果园，都被你收下啦！':'时间到，休息一口再来',won?`获得 ${score} 分 · 用时 ${(elapsed/1000).toFixed(1)} 秒`:`获得 ${score} 分 · 还剩 ${board.filter(Boolean).length/2} 对水果`, '再来一局',won?'🏆':'🍐');
  $('status').textContent=won?'漂亮！全部水果已消除。':'差一点点，再来挑战吧。';draw();
}
function finishEffect(){
  if(!effect)return;const current=effect;clearEffect();selected=null;
  if(current.type==='match'){
    board[current.a]=null;board[current.b]=null;score+=10;
    if(!board.some(Boolean)){end(true);return;}
    $('status').textContent='连接成功！+10 分';ensureMove();
  }
  draw();
}
function choose(i){
  if(state!=='running'||effect||!board[i]||!settleTime())return;
  hintCells=[];
  if(selected===i){selected=null;draw();return;}
  if(selected===null){selected=i;draw();return;}
  const a=selected,b=i,path=findPath(a,b);effect={type:path?'match':'invalid',a,b};draw();
  if(path){$('line').setAttribute('points',path.map(p=>`${(p.c+.5)*10},${(p.r+.5)*10}`).join(' '));tiles[a].classList.add('match');tiles[b].classList.add('match');}
  else{tiles[a].classList.add('invalid');tiles[b].classList.add('invalid');$('status').textContent=board[a]!==board[b]?'要选择两个相同的水果哦。':'这条路被挡住了，试试其他水果。';}
  effectTimer=setTimeout(()=>{if(state==='running'&&settleTime())finishEffect();},path?240:360);
}
function pause(){
  if(state==='running'){
    if(!settleTime())return;finishEffect();if(state!=='running')return;
    if(!settleTime())return;state='paused';hintCells=[];selected=null;
    showOverlay('让快乐稍等一下','计时已暂停，准备好了就继续。','继续游戏','☕');draw();
  }else if(state==='paused'){state='running';startedAt=performance.now();$('overlay').hidden=true;draw();}
}
for(let i=0;i<N*N;i++){const tile=document.createElement('button');tile.className='tile';tile.type='button';tile.addEventListener('click',()=>choose(i));$('grid').appendChild(tile);tiles.push(tile);}
$('start').addEventListener('click',()=>state==='paused'?pause():begin());$('restart').addEventListener('click',begin);$('pause').addEventListener('click',pause);
$('hint').addEventListener('click',()=>{if(state!=='running'||effect||hints<=0||!settleTime())return;const move=findMove();if(!move){ensureMove();draw();return;}hints--;selected=null;hintCells=[move.a,move.b];$('status').textContent='找到啦！试着连接这两个亮起的水果。';draw();});
$('shuffle').addEventListener('click',()=>{if(state!=='running'||effect||shuffles<=0||!settleTime())return;shuffles--;selected=null;hintCells=[];reshuffle();$('status').textContent='水果换了新位置，继续寻找吧。';draw();});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='running')pause();});
board=Array.from({length:64},(_,i)=>FRUITS[Math.floor(i/2)%FRUITS.length]);showBest();draw();
</script>
</body>
</html>
